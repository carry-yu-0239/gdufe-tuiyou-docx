name: Mini Program CI

on:
  pull_request:
    paths:
      - 'miniprogram/**'
      - 'project.config.json'
      - 'scripts/check_miniprogram.js'
      - '.github/workflows/miniprogram-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check miniprogram/pages/index/index.js
          node --check miniprogram/lib/engine.js
          node --check miniprogram/lib/template.js
      - name: Run DOCX engine smoke test
        run: node scripts/check_miniprogram.js
